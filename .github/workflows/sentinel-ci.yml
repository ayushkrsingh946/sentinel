name: "Sentinel CI & Security Verification"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic matplotlib pytest
          pip install -e .

      - name: Run Safety Rails & Security Unit Tests
        run: |
          pytest tests/ -v

      - name: Run Sentinel Self-Audit Scan
        run: |
          sentinel scan sentinel/ --threshold 60

      - name: Verify Audit Chain
        run: |
          sentinel audit
