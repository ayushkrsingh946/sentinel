# Sentinel Scope Allowlist Specification
# Non-negotiable security rail: Sentinel only scans or probes targets explicitly listed below.

version: 1.0
allowed_targets:
  - "localhost"
  - "127.0.0.1"
  - "0.0.0.0"
  - "staging.local"
  - "dev.local"

allowed_paths:
  - "."
  - "src"
  - "app"
  - "benchmark"
  - "packages"
  - "samples"

safety_rules:
  static_analysis_only: true
  execute_untrusted_code: false
  allow_destructive_probes: false
  max_probe_concurrency: 5
  probe_rate_limit_per_second: 10
  require_ownership_proof_for_remote: true
