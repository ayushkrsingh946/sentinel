[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security"
version = "1.0.0"
description = "Defensive security platform for source code and dependency updates powered by an open-weight model jury"
readme = "README.md"
authors = [{ name = "Ayush Kumar Singh", email = "ayushkrsingh946@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
